<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e33" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#1e4d7b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- High contrast outer background for all dark/light browser themes -->
  <circle cx="100" cy="100" r="96" fill="#ffffff" stroke="#0f2b48" stroke-width="7"/>
  <circle cx="100" cy="100" r="87" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,3"/>
  <circle cx="100" cy="100" r="72" fill="url(#crestGrad)"/>
  
  <!-- Outer Ring Text: School Initials & Name -->
  <text x="100" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#0f2b48" text-anchor="middle" letter-spacing="0.8">H.D. PANDEY PUBLIC J.H.S.</text>
  <text x="100" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#0f2b48" text-anchor="middle" letter-spacing="1">ESTD. 2008 • SKN, UP</text>
  
  <!-- Laurel / Rays -->
  <path d="M 58 140 C 46 115 48 82 74 58 C 70 74 74 94 84 104 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M 142 140 C 154 115 152 82 126 58 C 130 74 126 94 116 104 Z" fill="url(#goldGrad)" opacity="0.9"/>
  
  <!-- Star of Excellence -->
  <polygon points="100,46 102.5,52 108,52 103.5,55.5 105.5,61 100,57.5 94.5,61 96.5,55.5 92,52 97.5,52" fill="#fbbf24"/>
  
  <!-- Torch of Wisdom -->
  <polygon points="97,80 103,80 101.5,98 98.5,98" fill="#fbbf24"/>
  <path d="M 100 64 C 94 72 95 77 100 81 C 105 77 106 72 100 64 Z" fill="#ef4444"/>
  <circle cx="100" cy="72" r="3.5" fill="#fbbf24"/>
  
  <!-- Open Book of Knowledge -->
  <path d="M 72 124 C 86 117 96 121 100 127 C 104 121 114 117 128 124 C 125 106 114 100 100 104 C 86 100 75 106 72 124 Z" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
  <line x1="100" y1="104" x2="100" y2="127" stroke="#0f2b48" stroke-width="2.5"/>
  
  <!-- Lower Ribbon -->
  <path d="M 44 154 Q 100 176 156 154 L 150 142 Q 100 162 50 142 Z" fill="url(#goldGrad)"/>
</svg>
